apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name:  scan

jobs:
  scan:
    steps:
      - name: Initiate execution plan
        uses: https://github.com/cloudbees-io/asset-chain-utils/start-chain@CBP-70041
        id: plan


      - name: Github Inventory
        if: ${{ steps.plan.outputs.github-inventory == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-github-inventory:efc890ee1c61e9da7673da0b0e46692371bf3f8e
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
        run: /app/plugin-git-master -mode single

      - name: Github Metadata
        if: ${{ steps.plan.outputs.github-decorator == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-github-metadata:fb1cd38f35cd1bd265fa33e2fb974eaeeab424be
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
        run: /app/plugin-git-decorator -mode single

      - name: Bitbucket Inventory
        if: ${{ steps.plan.outputs.bitbucket-inventory == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-bitbucket-server:36dcc16bf09268477b1df5558aff38d5caec9be2
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "MASTER"
        run: /app/plugin-bitbucket -mode single

      - name: Bitbucket Metadata
        if: ${{ steps.plan.outputs.bitbucket-decorator == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-bitbucket-server:36dcc16bf09268477b1df5558aff38d5caec9be2
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "DECORATOR"
        run: /app/plugin-bitbucket -mode single
        
      - name: Gerrit Inventory
        if: ${{ steps.plan.outputs.gerrit-inventory == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-gerrit:b891e350ba140e88337b1522fc20047337102bad
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "MASTER"
        run: /app/plugin-gerrit -mode single

      - name: Gerrit Metadata
        if: ${{ steps.plan.outputs.gerrit-decorator == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-gerrit:b891e350ba140e88337b1522fc20047337102bad
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "DECORATOR"
        run: /app/plugin-gerrit -mode single

      - name: GitLab Inventory
        if: ${{ steps.plan.outputs.gitlab-inventory == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-gitlab:3c5949b6f0c1834e13bd2cc47122c60d23004035
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "MASTER"
        run: /app/plugin-gitlab -mode single

      - name: GitLab Metadata
        if: ${{ steps.plan.outputs.gitlab-decorator == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-gitlab:3c5949b6f0c1834e13bd2cc47122c60d23004035
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "DECORATOR"
        run: /app/plugin-gitlab -mode single

      - name: Cursor Inventory
        if: ${{ steps.plan.outputs.cursor-inventory == 'true' }}
        uses: docker://localhost:46027/assets-cursor:dev
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "MASTER"
        run: /app/plugin-cursor -mode single

      - name: Cursor Metadata
        if: ${{ steps.plan.outputs.cursor-decorator == 'true' }}
        uses: docker://localhost:46027/assets-cursor:dev
        env:
          ACCOUNT_CREDENTIALS: ${{ steps.plan.outputs.account_credentials}}
          EXECUTION_ROLE: "DECORATOR"
        run: /app/plugin-cursor -mode single

      - name: SCC Scanner
        if: ${{ steps.plan.outputs.scc == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-scc-scanner:7fa7cb33d5da26ef1477d3dc3e4846a770fa3aa0
        env:
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-scc-scanner -mode single

      - name: GoSec Scanner
        if: ${{ steps.plan.outputs.gosec == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-gosec-scanner:22912dd12e476786f4a7cdc4f0be86c051ccaa0d
        env:
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
          GOSEC_FORCE_SCAN: "true"
          GOSEC_AST_BUDGET_RATIO: "0.9"
        continue-on-error: true
        run: /app/plugin-gosec-scanner -mode single

      - name: Njs Scanner
        if: ${{ steps.plan.outputs.njsscan == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-njsscan-scanner:b62ff1818f2f69887eeaaae97099695c8774d2b1
        env:
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-njsscan-scanner -mode single

      - name: Gitleaks Scanner
        if: ${{ steps.plan.outputs.gitleaks == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-gitleaks-scanner:692a09d50b21acbb6e0d62cef92b768dfe84f91f
        continue-on-error: true
        env:
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        run: /app/plugin-gitleaks-scanner -mode single

      - name: BlackDuck Scanner
        if: ${{ steps.plan.outputs.blackduck == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/plugin-blackduck-sca:ee9285b5ad330dd2d045d544f20df03c971c89b8
        env:
          BLACKDUCK_PROPS : ${{ steps.plan.outputs.blackduck-props}}
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-blackduck-scanner -mode single

      - name: Coverity Polaris Scanner
        if: ${{ steps.plan.outputs.coverity == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/plugin-coverity-sca:df2e0193e1720f78db612cf13edb600150d1792f
        env:
          COVERITY_PROPS : ${{ steps.plan.outputs.coverity-props}}
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-coverity-polaris -mode single

      - name: Checkov Scanner
        if: ${{ steps.plan.outputs.checkov == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-checkov-scanner:a565e8b7960cf8d88e93abe095b40e98d0b51f5c
        env:
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-checkov -mode single

      - name: Snyk SAST Scanner
        if: ${{ steps.plan.outputs.snykcode == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-snyk-sast-scanner:b0ff80552121e1c8a4cfc169a7811f67e899fd11
        env:
          SNYK_SAST_PROPS: ${{ steps.plan.outputs.snykcode-props}}
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-snyk-sast-scanner -mode single

      - name: Snyk IaC Scanner
        if: ${{ steps.plan.outputs.snyk-iac == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-snyk-iac-scanner:d1c5db9841deee259bb4c736cf1222ec5600f845
        env:
          SNYK_IAC_PROPS: ${{ steps.plan.outputs.snyk-iac-props}}
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-snyk-iac-scanner -mode single

      - name: Snyk SCA Scanner
        if: ${{ steps.plan.outputs.snyksca == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-snyk-sca-scanner:26beda73d553bb1925103a14f7d721083b3e149a
        env:
          SNYK_SCA_PROPS: ${{ steps.plan.outputs.snyksca-props}}
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-snyk-sca-scanner -mode single

      - name: Checkmarxone SAST Scanner
        if: ${{ steps.plan.outputs.checkmarxone-sast == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-checkmarxone-sast-scanner:cacd851159d01128b1ee8af3ec0e4d1b1b193489
        env:
          CHECKMARXONE_SAST_PROPS: ${{ steps.plan.outputs.checkmarxone-sast-props}}
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-checkmarxone-sast-scanner -mode single 

      - name: Perforce Klocwork Scanner
        if: ${{ steps.plan.outputs.perforce-klocwork-sast == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-klocwork-scanner:3773435041acff15ea0d55d0700e8018e9cb09c9
        env:
          KLOCWORK_PROPS: ${{ steps.plan.outputs.perforce-klocwork-sast-props}}
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-klocwork-scanner -mode single


      - name: Sonar Scanner
        if: ${{ steps.plan.outputs.sonar == 'true' }}
        uses: docker://public.ecr.aws/l7o7z1g8/actions/assets-sonarqube-scanner:6f9984820490cddf25dc60aedaf894b7624d05d0
        env:
          SONARQUBE_PROPS: ${{ steps.plan.outputs.sonar-props}}
          RUN_ID: ${{ cloudbees.run_id }}
          JOB_ID: ${{ job.id }}
          STEP_ID: ${{ step.internal.id }}
        continue-on-error: true
        run: /app/plugin-sonarqube-scanner -mode single


      - name: Complete execution plan
        uses: https://github.com/cloudbees-io/asset-chain-utils/end-chain@CBP-70041
        id: process-outputs
